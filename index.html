<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/counsel-symbol-gold.svg" />
    <link rel="apple-touch-icon" href="/scales.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1d21" />

    <!-- Kept in sync with APP.domain (src/shared/config/env.ts) — update
         both together if the production domain ever changes. This is
         also the sitewide DEFAULT every route falls back to; individual
         public pages override title/description/canonical/OG/Twitter at
         runtime via src/shared/hooks/use-seo.ts (updates these SAME tags
         in place rather than adding new ones, so there is never a
         duplicate). '/' is the canonical homepage — RequireAuth renders
         the landing page directly at '/' for anonymous visitors (see
         route-guards.tsx), with '/welcome' as a secondary alias to the
         same content. -->
    <link rel="canonical" href="https://www.thecounsels.org/" />

    <title>Legal Practice Management Software for Law Firms | The Counsel</title>
    <meta
      name="description"
      content="The Counsel is a legal practice management platform that helps law firms manage clients, matters, documents, hearings, tasks, billing, teams and firm operations in one secure system."
    />
    <meta name="keywords" content="legal practice management software Nigeria, law firm management software Nigeria, law firm management system Nigeria, legal case management software Nigeria, legal practice management system, law firm billing software Nigeria, legal document management software, case management software for law firms, law firm software Nigeria, legal technology Nigeria" />
    <meta name="author" content="CloudTech Legal Suite" />
    <!-- Sitewide default is indexable (the marketing surface); the entire
         authenticated app overrides this to noindex at runtime (see
         useNoIndexWhenActive in RequireAuth, route-guards.tsx) so private
         firm data can never end up indexed even if fetched directly. -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Counsel" />
    <meta property="og:title" content="Legal Practice Management Software for Law Firms | The Counsel" />
    <meta
      property="og:description"
      content="The Counsel is a legal practice management platform that helps law firms manage clients, matters, documents, hearings, tasks, billing, teams and firm operations in one secure system."
    />
    <meta property="og:url" content="https://www.thecounsels.org/" />
    <meta property="og:image" content="https://www.thecounsels.org/og-image.svg" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Legal Practice Management Software for Law Firms | The Counsel" />
    <meta
      name="twitter:description"
      content="The Counsel is a legal practice management platform that helps law firms manage clients, matters, documents, hearings, tasks, billing, teams and firm operations in one secure system."
    />
    <meta name="twitter:image" content="https://www.thecounsels.org/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data — describes the product for search engines. Pricing
         mirrors the Starter tier (supabase/migrations 0053); update both
         together if pricing changes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "The Counsel",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Legal Practice Management Software",
        "operatingSystem": "Web",
        "description": "Enterprise legal practice management platform for law firms — matters, clients, hearings, billing, documents and reports in one secure, role-based workspace.",
        "url": "https://www.thecounsels.org/",
        "offers": {
          "@type": "Offer",
          "price": "15000",
          "priceCurrency": "NGN",
          "priceValidUntil": "2026-12-31"
        },
        "provider": {
          "@type": "Organization",
          "name": "CloudTech Legal Suite",
          "email": "cloudtechanalytics.consultant@gmail.com"
        }
      }
    </script>

    <!-- Organization + WebSite structured data (2026-09-01). Only fields
         that are actually true are included — no invented ratings,
         reviews, awards, physical address or social profiles; add those
         here later only once genuinely available. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CloudTech Analytics",
        "url": "https://www.thecounsels.org/",
        "email": "cloudtechanalytics.consultant@gmail.com",
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "SoftwareApplication",
            "name": "The Counsel",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Legal Practice Management Software"
          }
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Counsel",
        "url": "https://www.thecounsels.org/",
        "publisher": {
          "@type": "Organization",
          "name": "CloudTech Analytics"
        }
      }
    </script>

    <script>
      // Applied before paint so a stored/system dark preference never flashes light first.
      try {
        var t = localStorage.getItem('counsel.theme')
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
