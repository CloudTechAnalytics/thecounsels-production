services:
  - type: web
    name: the-counsel
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — deep links like /matters, /clients, /billing must all
      # serve index.html so React Router (not Render) resolves the route.
      # Same intent as the existing vercel.json's rewrite for the same app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
