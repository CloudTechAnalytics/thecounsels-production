# Supabase local development configuration.
# Run `supabase start` to boot the local stack, then `supabase db reset`
# to apply migrations in supabase/migrations.
project_id = "the-counsel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Public self-service signup is enabled: a visitor creates their own account at
# /auth/register, verifies their email, then completes /onboarding, which calls
# the register_organization() RPC to provision their firm — no admin involved.
# The Platform Owner is still bootstrapped separately (first user is auto-
# promoted by handle_new_user()); every OTHER admin-provisioned account still
# goes through the admin-create-user Edge Function exactly as before, unchanged.
# NOTE: on hosted Supabase this flag must also be turned on in the Dashboard
# under Authentication → Sign In / Providers → "Allow new users to sign up" —
# editing this file alone has no effect on an already-deployed project.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[realtime]
enabled = true
